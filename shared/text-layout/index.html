<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SRWZ 共享 JS 排版验证</title>
<style>body{background:#111821;color:#e9edf3;font:16px system-ui;max-width:1150px;margin:30px auto;padding:20px}h1{font-size:28px}label{margin-right:20px}select,button,textarea{font:inherit;background:#222f40;color:inherit;border:1px solid #62758f;border-radius:6px;padding:9px}textarea{box-sizing:border-box;width:100%;height:170px;line-height:1.7;margin:16px 0}button{cursor:pointer;margin-right:10px}button:hover{background:#344863}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.muted{color:#abb9cc}pre{background:#1d2938;padding:16px;white-space:pre-wrap;line-height:1.8}#geometry{overflow:auto;background:#1a2533;padding:20px;margin:12px 0}svg{display:block;background:#0c131c}#error{color:#ffb4b4;white-space:pre-wrap}#parity{padding:12px;border-left:4px solid #6e8aa9}details{margin-top:20px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #334357;text-align:left;padding:8px}</style>
<h1>SRWZ 共享 JS 排版验证</h1><p class="muted">浏览器直接 import 的核心与 Node.js API 完全相同。此页按固定step定位，正文使用游戏字库原始24×24格子缩放；不代替LRPS2游戏截图。保持文字、控制符、段落边界；不通过拉伸字距齐行。</p>
<div class="controls"><label>场景 <select id="scene"></select></label><label><input type="checkbox" id="preserve">保持输入行数（战斗默认启用）</label><label><input type="checkbox" id="escaped">输入使用字面 \n</label><label><input type="checkbox" id="words" checked>保护词语</label></div>
<p id="contract" class="muted"></p><p class="muted">显示的是可用宽度上限；非对白按最少行数均衡，实际行宽可能低于上限。保留段落后，短段不能通过拉字距强行与长段等宽。</p><textarea id="text" aria-label="待排版文本">“锁定&lt;z&gt;MS-013&lt;/z&gt;后立即攻击敌方指挥机，完成任务后返回基地！”</textarea>
<div><button id="run">浏览器排版</button><button id="compare">与后端逐字段比较</button><button id="sample">载入本场景示例</button><button id="ruler">载入满宽测试</button></div>
<p id="error" role="alert"></p><p id="parity" role="status">排版完全在浏览器本地运行；点击比较才请求后端。</p><div id="geometry"></div><pre id="output"></pre><table><thead><tr><th>行</th><th>推进量</th><th>字形外沿（含缩进）</th><th>预算</th></tr></thead><tbody id="rows"></tbody></table><details><summary>返回的完整 JSON</summary><pre id="json"></pre></details>
<script type="module" src="./demo.mjs"></script></html>
