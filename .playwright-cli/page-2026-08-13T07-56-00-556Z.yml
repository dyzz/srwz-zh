            - heading "斗争心" [level=3] [ref=f1e226]
            - paragraph [ref=f1e227]: 出击时气力＋5。
          - article [ref=f1e228]:
            - heading "战意高扬" [level=3] [ref=f1e229]
            - paragraph [ref=f1e230]: 出击第2回合起，每回合气力＋3。
          - article [ref=f1e231]:
            - heading "气力＋（回避）" [level=3] [ref=f1e232]
            - paragraph [ref=f1e233]: 回避敌方攻击时， 除原有气力增减外，气力再＋1。
          - article [ref=f1e234]:
            - heading "气力＋（命中）" [level=3] [ref=f1e235]
            - paragraph [ref=f1e236]: 攻击命中敌方时， 除原有气力增减外，气力再＋1。
          - article [ref=f1e237]:
            - heading "气力＋（伤害）" [level=3] [ref=f1e238]
            - paragraph [ref=f1e239]: 受到敌方伤害时， 除原有气力增减外，气力再＋2。
          - article [ref=f1e240]:
            - heading "气力＋（击破）" [level=3] [ref=f1e241]
            - paragraph [ref=f1e242]: 任一友方击坠敌机时 （困难难度下为歼灭敌方小队时）， 除原有气力增减外，气力再＋1。
          - article [ref=f1e243]:
            - heading "气力上限突破" [level=3] [ref=f1e244]
            - paragraph [ref=f1e245]: 气力上限提高至170。
          - article [ref=f1e246]:
            - heading "E节省" [level=3] [ref=f1e247]
            - paragraph [ref=f1e248]: 武器的EN消耗变为通常的80%。
          - article [ref=f1e249]:
            - heading "B节省" [level=3] [ref=f1e250]
            - paragraph [ref=f1e251]: 武器弹数变为1.5倍， 小数部分舍去。
          - article [ref=f1e252]:
            - heading "连携攻击" [level=3] [ref=f1e253]
            - paragraph [ref=f1e254]: 援护攻击和再攻击必定产生暴击。
          - article [ref=f1e255]:
            - heading "支援攻击" [level=3] [ref=f1e256]
            - paragraph [ref=f1e257]: 作为小队员参与小队攻击时， 对敌伤害＋20%。
          - article [ref=f1e258]:
            - heading "集束攻击" [level=3] [ref=f1e259]
            - paragraph [ref=f1e260]: 使用ALL武器时，敌方小队有2机／3机时， 原本分别为－20%／－40%的伤害修正， 降低为－5%／－25%。
          - article [ref=f1e261]:
            - heading "无视尺寸差修正" [level=3] [ref=f1e262]
            - paragraph [ref=f1e263]: 无视尺寸差修正造成的伤害降低。
          - article [ref=f1e264]:
            - heading "指挥官" [level=3] [ref=f1e265]
            - paragraph [ref=f1e266]: 提升周围友方单位的最终命中率和回避率。 效果由技能等级及与技能持有者的距离决定。
