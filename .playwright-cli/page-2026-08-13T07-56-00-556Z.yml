      - generic [ref=f1e16]:
        - paragraph [ref=f1e17]: 游戏内全部45项特殊技能及其实际效果。有等级的技能直接列出每级效果。不可通过PP购买、且我方常驻或可控客串角色中持有人去重后不超过5人的技能标为稀有；同一人物的化名与剧情形态合并计算。
