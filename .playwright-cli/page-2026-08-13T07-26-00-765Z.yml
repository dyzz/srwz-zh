  - main [ref=e13]:
    - generic [ref=e488]:
      - generic [ref=e489]:
        - paragraph [ref=e490]: 游戏内有名称的机体特殊能力。相同效果会按不同能力名分别列出。
        - generic [ref=e491]:
          - article [ref=e492]:
            - heading "干扰功能" [level=3] [ref=e493]
            - paragraph [ref=e494]: 使所属小队全员的最终命中率、回避率＋10%。 即使持有该能力的是小队员，也同样生效。
          - article [ref=e495]:
            - heading "升空功能" [level=3] [ref=e496]
            - paragraph [ref=e497]: 使小队全机获得“空”移动类型， 机体与武器的“空”地形适应变为A。 即使持有该能力的是小队员，也同样生效。
          - article [ref=e498]:
            - heading "HP回复（小）" [level=3] [ref=e499]
            - paragraph [ref=e500]: 我方阶段开始时，回复最大HP的10%。 可与其他回复效果叠加。
          - article [ref=e501]:
            - heading "HP回复（中）" [level=3] [ref=e502]
            - paragraph [ref=e503]: 我方阶段开始时，回复最大HP的20%。 可与其他回复效果叠加。
          - article [ref=e504]:
            - heading "HP回复（大）" [level=3] [ref=e505]
            - paragraph [ref=e506]: 我方阶段开始时，回复最大HP的30%。 可与其他回复效果叠加。
          - article [ref=e507]:
            - heading "EN回复（小）" [level=3] [ref=e508]
            - paragraph [ref=e509]: 我方阶段开始时，回复最大EN的10%。 可与其他回复效果叠加。
          - article [ref=e510]:
            - heading "EN回复（中）" [level=3] [ref=e511]
            - paragraph [ref=e512]: 我方阶段开始时，回复最大EN的20%。 可与其他回复效果叠加。
          - article [ref=e513]:
            - heading "EN回复（大）" [level=3] [ref=e514]
            - paragraph [ref=e515]: 我方阶段开始时，回复最大EN的30%。 可与其他回复效果叠加。
          - article [ref=e516]:
            - heading "魔神力" [level=3] [ref=e517]
            - paragraph [ref=e518]: 气力130以上时发动， 对敌方造成的最终伤害变为1.25倍。
          - article [ref=e519]:
            - heading "古连泰沙全功率" [level=3] [ref=e520]
            - paragraph [ref=e521]: 气力130以上时发动， 对敌方造成的最终伤害变为1.25倍。
          - article [ref=e522]:
            - heading "亚空间突入" [level=3] [ref=e523]
            - paragraph [ref=e524]: 气力130以上时发动。移动时无视地形影响， 并有25%的概率完全回避敌方攻击。
          - article [ref=e525]:
            - heading "三位一体充能" [level=3] [ref=e526]
            - paragraph [ref=e527]: 每张地图限用一次，可完全回复EN。
          - article [ref=e528]:
            - heading "元素系统" [level=3] [ref=e529]
            - paragraph [ref=e530]: 气力130以上时发动。 主驾驶员的各项能力值，采用3名驾驶员中的最高值。
          - article [ref=e531]:
            - heading "LFO" [level=3] [ref=e532]
            - paragraph [ref=e533]: 处于空中时，每回合不会消耗EN。
          - article [ref=e534]:
            - heading "KLF" [level=3] [ref=e535]
            - paragraph [ref=e536]: 处于空中时，每回合不会消耗EN。
          - article [ref=e537]:
            - heading "抗精神攻击" [level=3] [ref=e538]
            - paragraph [ref=e539]: 完全免疫P系特殊效果。
          - article [ref=e540]:
            - heading "完全抗性" [level=3] [ref=e541]
            - paragraph [ref=e542]: 完全免疫P系、R系特殊效果。
          - article [ref=e543]:
            - heading "变形" [level=3] [ref=e544]
            - paragraph [ref=e545]: 可切换机体形态。
          - article [ref=e546]:
            - heading "合体·分离" [level=3] [ref=e547]
            - paragraph [ref=e548]: 可将多个单位合体为一个单位，或进行分离。 相关单位必须编入同一小队。
          - article [ref=e549]:
            - heading "生物传感器" [level=3] [ref=e550]
            - paragraph [ref=e551]: 驾驶员为新人类Lv5以上且气力130以上时发动， 强化机体和武器性能。
          - article [ref=e552]:
            - heading "精神感应框架" [level=3] [ref=e553]
            - paragraph [ref=e554]: 驾驶员为新人类Lv5以上且气力130以上时发动， 强化机体和武器性能。
          - article [ref=e555]:
            - heading "战术换装" [level=3] [ref=e556]
            - paragraph [ref=e557]: 地图上有密涅瓦时，可进行机体换装。 换下的部件在同一张地图内不能再次换装。
          - article [ref=e558]:
            - heading "合神" [level=3] [ref=e559]
            - paragraph [ref=e560]: 气力130以上时，可合神为神机超重神。 维持该形态3回合后将强制解除合神， 且本地图内不能再次合神。
          - article [ref=e561]:
            - heading "重力子临界" [level=3] [ref=e562]
            - paragraph [ref=e563]: 维持神机超重神形态3回合后将强制解除合神， 且本地图内不能再次合神。
          - article [ref=e564]:
            - heading "分身" [level=3] [ref=e565]
            - paragraph [ref=e566]: 气力130以上时发动。 无论命中率高低，均可完全回避敌方攻击。 发动概率因能力而异。
          - article [ref=e567]:
            - heading "超限战术" [level=3] [ref=e568]
            - paragraph [ref=e569]: 气力130以上时发动，效果因不同超限人而异。
          - article [ref=e570]:
            - heading "精神感应力场" [level=3] [ref=e571]
            - paragraph [ref=e572]: 使2000以下的伤害无效。 气力130以上时发动，消耗5 EN。 采用中央队形时，对小队全机生效。
          - article [ref=e573]:
            - heading "I力场" [level=3] [ref=e574]
            - paragraph [ref=e575]: 使射击光束攻击造成的伤害减轻1000。 消耗10 EN。 采用中央队形时，对小队全机生效。
          - article [ref=e576]:
            - heading "I力场△" [level=3] [ref=e577]
            - paragraph [ref=e578]: 使射击光束攻击造成的伤害减轻1500。 气力110以上时发动，消耗10 EN。 采用中央队形时，对小队全机生效。
          - article [ref=e579]:
            - heading "龙骑兵屏障" [level=3] [ref=e580]
            - paragraph [ref=e581]: 使1500以下的伤害无效。 气力100以上时发动，消耗10 EN。 采用中央队形时，对小队全机生效。
          - article [ref=e582]:
            - heading "阳电子反射器" [level=3] [ref=e583]
            - paragraph [ref=e584]: 使2500以下的伤害无效。 消耗10 EN。 采用中央队形时，对小队全机生效。
          - article [ref=e585]:
            - heading "光子垫" [level=3] [ref=e586]
            - paragraph [ref=e587]: 使伤害减轻1000＋超感知Lv×100。 气力110以上时发动，消耗5 EN。 采用中央队形时，对小队全机生效。
          - article [ref=e588]:
            - heading "光子垫（强）" [level=3] [ref=e589]
            - paragraph [ref=e590]: 使伤害减轻2000。 气力100以上时发动，消耗5 EN。 采用中央队形时，对小队全机生效。
          - article [ref=e591]:
            - heading "防护力场" [level=3] [ref=e592]
            - paragraph [ref=e593]: 使伤害减轻1000。 消耗10 EN。 采用中央队形时，对小队全机生效。
          - article [ref=e594]:
            - heading "VPS装甲" [level=3] [ref=e595]
            - paragraph [ref=e596]: 使非光束属性的伤害减轻2000。 消耗10 EN。
          - article [ref=e597]:
            - heading "PS装甲" [level=3] [ref=e598]
            - paragraph [ref=e599]: 使非光束属性的伤害减轻2000。 消耗10 EN。
          - article [ref=e600]:
            - heading "八咫镜" [level=3] [ref=e601]
            - paragraph [ref=e602]: 使射击光束攻击完全无效。 消耗10 EN。
          - article [ref=e603]:
            - heading "积层装甲" [level=3] [ref=e604]
            - paragraph [ref=e605]: 使2500以下的光束属性伤害无效。 消耗10 EN。
          - article [ref=e606]:
            - heading "盾装备" [level=3] [ref=e607]
            - paragraph [ref=e608]: 选择“防御”时，装备盾牌可通过“盾牌防御” 将伤害进一步减轻。驾驶员持有“格挡”时， 选择“反击”也可能发动同样的效果。
          - article [ref=e609]:
            - heading "剑装备" [level=3] [ref=e610]
            - paragraph [ref=e611]: 驾驶员持有“格挡”技能时，可发动“斩切”， 使敌方物理攻击无效。 发动概率由双方的技量差决定。
          - article [ref=e612]:
            - heading "补给装置" [level=3] [ref=e613]
            - paragraph [ref=e614]: 使本小队或相邻小队的1台单位完全回复EN与弹数。 此外，我方阶段开始时，小队全机回复最大EN的10%。 即使持有该能力的是小队员，也同样生效。
          - article [ref=e615]:
            - heading "修理装置" [level=3] [ref=e616]
            - paragraph [ref=e617]: 回复本小队或相邻小队所有单位的HP。 此外，我方阶段开始时，小队全机回复最大HP的10%。 即使持有该能力的是小队员，也同样生效。
          - article [ref=e618]:
            - heading "HP回复（小～大）" [level=3] [ref=e619]
            - paragraph [ref=e620]: 我方阶段开始时，回复一定比例的HP。
          - article [ref=e621]:
            - heading "EN回复（小～大）" [level=3] [ref=e622]
            - paragraph [ref=e623]: 我方阶段开始时，回复一定比例的EN。
          - article [ref=e624]:
            - heading "马赫特技" [level=3] [ref=e625]
            - paragraph [ref=e626]: 气力130以上时发动。 无论命中率高低，均可完全回避敌方攻击。 发动概率因能力而异。
      - complementary [ref=e627]:
        - generic [ref=e628]: Akurasu 资料差异
        - list [ref=e629]:
          - listitem [ref=e630]: Akurasu 的英文说明把修理装置、补给装置带来的小队阶段回复写成“数量×3%”；游戏内说明为每台装置10%，本页采用游戏内数值。