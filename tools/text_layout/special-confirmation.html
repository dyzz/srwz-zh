<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>55 条特殊排版 · 单独确认</title>
<style>
:root{font:16px/1.6 system-ui,-apple-system,sans-serif;color:#20354b;background:#f3f5f7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit;color:inherit}button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #32828a;outline-offset:3px}header{background:#173c46;color:#fff;padding:24px max(24px,calc((100vw - 1320px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}header strong{font-size:21px}header small{display:block;color:#c5dadd}main{max-width:1368px;margin:auto;padding:28px 24px}h1{font-size:30px;margin:0 0 8px}h2{font-size:23px;margin:0}h3{font-size:16px;margin:0 0 10px}p{margin:8px 0}.muted{color:#596d7b;font-size:14px}.intro{max-width:980px;margin-bottom:22px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}.cards button{background:white;border:1px solid #d3dfe2;border-top:3px solid #95afb5;border-radius:6px;text-align:left;padding:16px}.cards button.active{border-color:#287781;background:#edf7f7}.cards strong{display:block;font-size:28px}.cards small{color:#596d7b}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.bar label{font-size:14px}.bar input,.bar select{margin-left:5px;border:1px solid #b9c9d1;border-radius:4px;padding:7px;background:white}.bar input{width:220px}.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px}.queue{border:1px solid #d3dfe2;border-radius:6px;background:#fff;align-self:start;max-height:76vh;overflow:auto}.queue button{border:0;border-bottom:1px solid #e4eaed;background:#fff;display:block;width:100%;text-align:left;padding:14px 16px}.queue button.active{background:#e5f2f3;border-left:4px solid #287781;padding-left:12px}.queue .snippet{display:block;font-size:14px;margin:5px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.queue .status{font-size:12px;color:#526975}.detail{background:#fff;border:1px solid #d3dfe2;border-radius:6px;padding:24px;min-width:0}.detail-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{border-radius:4px;padding:3px 9px;background:#edf1f5;color:#476070;font-size:13px;white-space:nowrap}.source{overflow-wrap:anywhere;font-size:13px;color:#657583;margin:8px 0 18px}.panel{border:1px solid #dce5e9;border-radius:5px;padding:16px;margin:16px 0}.text{white-space:pre-wrap;overflow-wrap:anywhere;font:16px/1.8 system-ui;margin:0}.proposal{background:#f7fbfb}mark{color:#135961;background:#d5eeee;border-bottom:2px solid #468f94;border-radius:2px;padding:1px 0}.legend{font-size:13px;color:#527079;margin:8px 0}.native{background:#fff7e9;border:1px solid #e8d4aa;padding:2px 6px;margin:3px;display:inline-block;font-family:monospace;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 10px}button.action,.secondary,a.secondary{border:1px solid #b5c7ce;background:#fff;border-radius:4px;padding:8px 14px;text-decoration:none;font-size:14px}.primary{background:#216d77!important;color:white;border-color:#216d77!important}.actions button.chosen{box-shadow:0 0 0 2px #216d77}.edit textarea{width:100%;min-height:130px;margin-top:8px;padding:12px;border:1px solid #aabec9;border-radius:4px;font:15px/1.7 monospace;white-space:pre-wrap}.edit label{display:block;margin-top:12px}.note{width:100%;min-height:74px;border:1px solid #b6c8d0;border-radius:4px;padding:10px;resize:vertical}.save-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}.save-line #save{padding:10px 24px}.notice{font-size:14px;color:#5c6f7b}.notice.error{color:#a83a27}.asset-scroll{overflow:auto;padding:12px;background:#26343d;border-radius:4px}.asset{background-repeat:no-repeat;image-rendering:pixelated;flex:none}.asset-link{font-size:13px;color:#286d79}.checks{border-left:3px solid #bba778;background:#fbf8f1;padding:12px 16px;font-size:14px}.pager{display:flex;justify-content:space-between;margin-top:22px;gap:12px}.empty{padding:25px;color:#637784}.progress{margin-top:8px;font-size:14px}.progress-track{height:5px;background:#34535b;border-radius:3px;overflow:hidden}.progress-track div{height:100%;background:#94d4cd}footer{font-size:13px;color:#657583;margin:20px 0}.edit[hidden]{display:none}@media(max-width:950px){.layout{grid-template-columns:230px minmax(0,1fr)}.cards{gap:8px}.detail{padding:18px}}@media(max-width:700px){main{padding:20px 14px}header{padding:18px}.cards{grid-template-columns:1fr 1fr}.cards button{padding:12px}.layout{grid-template-columns:1fr}.queue{max-height:200px}.bar input{width:170px}.detail-top{align-items:start;flex-direction:column}h1{font-size:25px}header strong{font-size:18px}.detail{padding:16px}}
</style></head><body>
<header><div><strong>机战 Z · 特殊排版确认</strong><small>本体 / BEST / SP · 仅本地保存</small></div><div style="min-width:170px"><div id="progress" class="progress">正在读取…</div><div class="progress-track"><div id="progress-fill"></div></div></div></header>
<main><section class="intro"><h1>这 55 条，单独决定</h1><p>确认符号边界、原生标记、动态模板与图片文字的处理方式。每条建议均保留原文，点击保存后记录你的决定。</p><p class="muted">高亮表示拟收窄的范围，不是游戏字体效果。图片展示既有资产，确认的是后续处理方向；容量、模板展开及游戏画面验证仍需完成。</p></section>
<div id="categories" class="cards"></div>
<div class="bar"><label>状态<select id="filter"><option value="all">全部状态</option><option value="pending">待确认</option><option value="approved">采用建议</option><option value="custom">自定方案</option><option value="keep">保留现状</option><option value="defer">暂缓</option></select></label><label>搜索<input id="search" placeholder="原文、ID 或来源"></label><span id="count" class="muted"></span><a class="secondary" href="/api/export" download="special-typography-decisions.json">导出全部决定</a><button id="all" class="secondary">查看全部 55 条</button></div>
<div class="layout"><nav class="queue" id="queue" aria-label="确认条目"></nav><article class="detail" id="detail"><p>正在读取清单…</p></article></div>
<footer>决定只写入本地 decisions.json；保存不会自动改写语料、图片或 ISO。<span id="snapshot"></span></footer></main>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={pending:'待确认',approved:'采用建议',custom:'自定方案',keep:'保留现状',defer:'暂缓'};
let data,state,category='',selected=null,choice='',dirty=false,busy=false;
const decision=r=>state.decisions[r.key]?.decision||'pending';
function marked(value){return esc(value).replace(/\[\[/g,'<mark>').replace(/\]\]/g,'</mark>')}
function currentRows(){const q=$('search').value.toLowerCase();return data.rows.filter(r=>(!category||r.status===category)&&($('filter').value==='all'||decision(r)===$('filter').value)&&(!q||[r.text,r.id,r.path].join(' ').toLowerCase().includes(q)))}
function canLeave(){return !busy&&(!dirty||confirm('当前修改尚未保存，离开并放弃这次修改？'))}
function renderNav(){const final=Object.values(state.decisions).filter(d=>d.decision!=='defer').length;const defer=Object.values(state.decisions).filter(d=>d.decision==='defer').length;$('progress').textContent=`已决定 ${final} / 55 · 暂缓 ${defer}`;$('progress-fill').style.width=`${final/55*100}%`;$('categories').innerHTML=Object.entries(data.categories).map(([k,label])=>{const done=data.rows.filter(r=>r.status===k&&!['pending','defer'].includes(decision(r))).length;return `<button data-category="${k}" class="${category===k?'active':''}"><span>${esc(label)}</span><strong>${data.counts[k]}</strong><small>已决定 ${done} / ${data.counts[k]}</small></button>`}).join('');document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{if(!canLeave())return;dirty=false;category=b.dataset.category;selected=null;render()});const rows=currentRows();$('count').textContent=`当前 ${rows.length} 条`;$('queue').innerHTML=rows.length?rows.map((r,i)=>`<button data-key="${r.key}" class="${selected===r.key?'active':''}" ${selected===r.key?'aria-current="true"':''}><span class="status">${i+1}. ${esc(data.categories[r.status])} · ${labels[decision(r)]}</span><strong class="snippet">${esc(r.text)}</strong><span class="status">${esc(r.id||r.json_pointer)}</span></button>`).join(''):'<p class="empty">没有符合筛选的条目。</p>';document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(!canLeave())return;dirty=false;selected=b.dataset.key;render()})}
function render(){const rows=currentRows();if(!rows.some(r=>r.key===selected))selected=rows[0]?.key||null;renderNav();const r=rows.find(r=>r.key===selected);if(!r){$('detail').innerHTML='<p class="empty">此筛选下没有条目。可以切换分类或状态。</p>';return}const saved=state.decisions[r.key];choice=saved?.decision||'';const annotation=saved?.annotation||r.proposal;const tokens=r.text.match(/<<[^>]+>>|<\d+>|＜ｔｍ＞.*?＜／ｔｍ＞/gs)||[];const image=r.image;const i=rows.indexOf(r);$('detail').innerHTML=`<div class="detail-top"><h2>${esc(data.categories[r.status])}</h2><span class="pill">${labels[decision(r)]} · ${i+1} / ${rows.length}</span></div><div class="source">${esc(r.id||r.json_pointer)} · ${esc(r.editions.map(x=>({original:'本体',best:'BEST',sp:'SP'})[x]).join(' / '))}</div><div class="panel"><h3>当前原文</h3><pre class="text">${esc(r.text)}</pre></div>${tokens.length?`<p class="muted">完整保留以下原生标记／模板：</p><div>${tokens.map(t=>`<span class="native">${esc(t)}</span>`).join('')}</div>`:''}${image?`<div class="panel"><h3>既有图片 · 供确认对象与布局</h3><div class="asset-scroll"><div class="asset" role="img" aria-label="${esc(r.text)}既有资产" style="width:${image.width}px;height:${image.height}px;background-image:url('${image.url}');background-position:-${image.x}px -${image.y}px"></div></div><p class="source">${esc(r.asset_location)}</p><a class="asset-link" href="${image.url}" target="_blank" rel="noopener">打开完整既有图集</a></div>`:''}<div class="panel proposal"><h3>${image?'拟调整图片中的字段':'建议收窄边界'}</h3><pre class="text">${marked(r.proposal)}</pre><p class="legend">青色高亮：拟收窄范围。其余正文、标点及控制语法保持原有处理。</p><p>${esc(r.reason)}</p></div><details><summary>来源与原始记录</summary><p class="source">${esc(r.path)}<br>${esc(r.json_pointer)}<br>SHA-256 ${r.source_sha256}</p>${typeof r.japanese==='string'&&r.japanese?`<pre class="text">${esc(r.japanese)}</pre>`:''}<pre class="text">${esc(r.raw)}</pre></details><div class="checks"><strong>确认后需验证：</strong>${esc(r.checks)}</div><div class="actions" role="group" aria-label="选择处理方式">${[['approved','采用建议'],['custom',image?'修改处理说明':'修改边界'],['keep','保留现状'],['defer','暂缓']].map(([v,t])=>`<button class="action ${choice===v?'chosen':''}" data-choice="${v}" aria-pressed="${choice===v}">${t}</button>`).join('')}</div><div id="edit" class="edit" ${choice==='custom'?'':'hidden'}><label for="annotation">用 [[ ]] 标记收窄范围；保留所有原文与控制语法。</label><textarea id="annotation" spellcheck="false">${esc(annotation)}</textarea><p class="muted">图片条目在这里标明目标字段，并在下方填写字形／排版要求。</p></div><label for="note" class="muted">备注（自定方案或暂缓时必填）</label><textarea id="note" class="note" placeholder="说明边界选择、图片布局要求或暂缓原因">${esc(saved?.note||'')}</textarea><div class="save-line"><button id="save" class="action primary">保存本条决定</button><button id="reset" class="secondary" ${!saved?'disabled':''}>恢复待确认</button><span id="notice" class="notice" role="status" aria-live="polite">${saved?'已保存于 '+new Date(saved.updated_at).toLocaleString():'尚未保存决定'}</span></div><div class="pager"><button id="previous" class="secondary" ${i===0?'disabled':''}>上一条</button><button id="next" class="secondary" ${i===rows.length-1?'disabled':''}>下一条</button></div>`;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{choice=b.dataset.choice;dirty=true;document.querySelectorAll('[data-choice]').forEach(x=>{x.classList.toggle('chosen',x.dataset.choice===choice);x.setAttribute('aria-pressed',String(x.dataset.choice===choice))});$('edit').hidden=choice!=='custom';$('notice').textContent='尚未保存此次修改'});for(const id of ['annotation','note'])$(id).oninput=()=>{dirty=true;$('notice').textContent='尚未保存此次修改'};$('save').onclick=()=>save(r,false);$('reset').onclick=()=>save(r,true);$('previous').onclick=()=>move(-1);$('next').onclick=()=>move(1)}
function move(delta){if(!canLeave())return;dirty=false;const rows=currentRows();selected=rows[rows.findIndex(r=>r.key===selected)+delta]?.key||selected;render()}
async function save(r,reset){if(busy)return;const selectedChoice=reset?'pending':choice;if(!selectedChoice){$('notice').textContent='请先选择一种处理方式';return}const note=$('note').value;if(['custom','defer'].includes(selectedChoice)&&!note.trim()){$('notice').textContent='请先填写修改说明或暂缓原因';return}busy=true;$('save').disabled=true;$('reset').disabled=true;$('notice').textContent='正在保存…';try{const response=await fetch('/api/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:r.key,decision:selectedChoice,annotation:$('annotation').value,note,fingerprint:data.fingerprint,revision:state.revision})});const result=await response.json();if(!response.ok)throw Error(result.error);state=result;dirty=false;render();if($('notice'))$('notice').textContent=reset?'已恢复待确认':'已保存到本地文件'}catch(error){$('notice').textContent=error.message;$('notice').classList.add('error')}finally{busy=false;if($('save'))$('save').disabled=false;if($('reset'))$('reset').disabled=!state.decisions[r.key]}}
for(const id of ['search','filter'])$(id).addEventListener(id==='search'?'input':'change',()=>{if(!canLeave()){if(id==='filter')$('filter').value='all';return}dirty=false;selected=null;render()});$('all').onclick=()=>{if(!canLeave())return;dirty=false;category='';$('filter').value='all';$('search').value='';selected=null;render()};window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue=''}});
Promise.all([fetch('/data.json').then(r=>r.json()),fetch('/api/state').then(r=>r.json())]).then(([d,s])=>{data=d;state=s;if(d.fingerprint!==s.fingerprint)throw Error('清单与决定版本不一致');$('snapshot').textContent=' 来源快照 '+d.source_commit.slice(0,8)+'。';render()}).catch(e=>{$('detail').textContent='加载失败：'+e.message});
</script></body></html>
